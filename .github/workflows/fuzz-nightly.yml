name: Nightly fuzzing

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  # The fuzz targets, read from harness/fuzz/Cargo.toml, so that each runs in its own job.
  targets:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          list=$(sed -n 's/^name = "\(.*\)"$/\1/p' harness/fuzz/Cargo.toml \
            | grep -v '^hash-lean-fuzz$' | jq -R . | jq -cs .)
          echo "list=$list" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space (Mathlib's cache does not fit otherwise)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Build the Lean static libraries
        run: lake build HashFFI:static Hash:static
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz for 30 minutes
        working-directory: harness/fuzz
        # -detect_leaks=0: one-time initialisation state is never freed, and LeakSanitizer reports
        # it at exit (624 bytes in 74 objects after 856,924 runs, while libFuzzer's per-input leak
        # check flagged no input). AddressSanitizer still catches memory errors.
        env:
          HASH_LEAN_SKIP_LAKE: "1"
        run: cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time=1800 -max_len=65536 -detect_leaks=0
      - name: Keep any crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: harness/fuzz/artifacts
