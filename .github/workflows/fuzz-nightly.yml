name: Nightly fuzzing

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Build the Lean static libraries
        run: lake build HashFFI:static Hash:static
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 30 minutes
        working-directory: harness/fuzz
        env:
          HASH_LEAN_SKIP_LAKE: "1"
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -max_total_time=1800 -max_len=65536
          done
      - name: Keep any crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: harness/fuzz/artifacts
