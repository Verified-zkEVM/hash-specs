[package]
name = "hash-lean"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "In-process bindings to the fast Lean specifications of the `Hash` library, for differential testing and benchmarking."

[dependencies]

[build-dependencies]
cc = "1"

[dev-dependencies]
aws-lc-rs = "1"
criterion = { version = "0.5", default-features = false }
hex = "0.4"
proptest = "1"
sha2 = "0.10"
sha3 = "0.10"
tiny-keccak = { version = "2", features = ["sha3", "keccak", "shake"] }
alloy-primitives = "1"
blake2 = "0.10"
blake2b_simd = "1"
blake2s_simd = "1"
eip-152 = "0.1.0"
blake3 = "1"
blake3-reference = { path = "../blake3-reference" }
revm-precompile = { version = "43.0.3", default-features = false }
light-poseidon = "0.4"
ark-bn254 = "0.5"
ark-ff = "0.5"
poseidon-rs = "0.0.10"
ff = { version = "0.11", package = "ff_ce" }
p3-koala-bear = "0.8"
p3-baby-bear = "0.8"
p3-poseidon2 = "0.8"
p3-field = "0.8"
p3-symmetric = "0.8"
p3-bn254 = "0.8"
zkhash = "0.2.0"
num-bigint = "0.5"

[[bench]]
name = "throughput"
harness = false
