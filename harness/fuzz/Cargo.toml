[package]
name = "hash-lean-fuzz"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
aws-lc-rs = "1"
hash-lean = { path = "../hash-lean" }
libfuzzer-sys = "0.4"
sha2 = "0.10"
sha3 = "0.10"
tiny-keccak = { version = "2", features = ["sha3", "keccak", "shake"] }

[[bin]]
name = "sha2"
path = "fuzz_targets/sha2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sha2_stream"
path = "fuzz_targets/sha2_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keccak"
path = "fuzz_targets/keccak.rs"
test = false
doc = false
bench = false
