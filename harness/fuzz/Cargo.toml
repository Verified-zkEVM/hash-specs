[package]
name = "hash-lean-fuzz"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
aws-lc-rs = "1"
blake2b_simd = "1"
blake3 = "1"
blake3-reference = { path = "../blake3-reference" }
blake2s_simd = "1"
hash-lean = { path = "../hash-lean" }
libfuzzer-sys = "0.4"
revm-precompile = { version = "43.0.3", default-features = false }
sha2 = "0.10"
sha3 = "0.10"
tiny-keccak = { version = "2", features = ["sha3", "keccak", "shake"] }
light-poseidon = "0.4"
ark-bn254 = "0.5"
ark-ff = "0.5"
poseidon-rs = "0.0.10"
hex = "0.4"
ff = { version = "0.11", package = "ff_ce" }
p3-koala-bear = "0.8"
p3-baby-bear = "0.8"
p3-field = "0.8"
p3-symmetric = "0.8"
zkhash = "0.2.0"

[[bin]]
name = "sha2"
path = "fuzz_targets/sha2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sha2_stream"
path = "fuzz_targets/sha2_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keccak"
path = "fuzz_targets/keccak.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keccak_stream"
path = "fuzz_targets/keccak_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blake2"
path = "fuzz_targets/blake2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blake2_stream"
path = "fuzz_targets/blake2_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blake2b_f"
path = "fuzz_targets/blake2b_f.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blake3"
path = "fuzz_targets/blake3.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blake3_stream"
path = "fuzz_targets/blake3_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "poseidon"
path = "fuzz_targets/poseidon.rs"
test = false
doc = false
bench = false

[[bin]]
name = "poseidon2"
path = "fuzz_targets/poseidon2.rs"
test = false
doc = false
